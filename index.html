<h2>

💬 الشات

</h2>
<p id="onlineStatus"></p>
<p id="typingStatus"></p>
<div id="chatBox">

</div>

<button id="newMessagesIndicator" class="newMessagesIndicator" type="button" hidden>
	<span aria-hidden="true">↓</span>
	<span>New messages</span>
</button>

<div id="replyPreview" class="replyPreview" hidden>
	<span class="replyPreviewBar" aria-hidden="true"></span>
	<div class="replyPreviewCopy">
		<strong class="replyPreviewSender"></strong>
		<span class="replyPreviewText"></span>
	</div>
	<button type="button" class="replyPreviewClose" onclick="cancelReply()" aria-label="Cancel reply">×</button>
</div>

<div class="composerTools" aria-label="Message tools">
	<button id="stickerBtn" type="button" aria-label="Open stickers">☺</button>
	<button id="gifBtn" type="button" aria-label="Open GIFs">GIF</button>
	<textarea id="messageInput" placeholder="اكتب رسالة..." aria-label="Message" oninput="typing()"></textarea>
	<button id="sendBtn" type="button" onclick="sendMessage()" aria-label="Send message">↗</button>
	<button id="recordBtn" type="button" aria-label="Record voice message">
		<span aria-hidden="true">🎤</span>
		<span id="recordingLabel">Hold to record</span>
		<span id="recordingTimer" hidden>0:00</span>
		<span id="recordingCancelHint" hidden>Slide left to cancel</span>
	</button>
	<div id="recordingOverlay" class="recordingOverlay" hidden aria-live="polite">
		<span class="recordingCancelLabel">← Slide to cancel</span>
		<strong id="recordingOverlayTimer">0:00</strong>
		<span id="recordingOverlayHint">Slide left to cancel</span>
	</div>
</div>

<div id="mediaPicker" class="mediaPicker" hidden>
	<div class="mediaPickerHeader">
		<strong id="mediaPickerTitle">Stickers</strong>
		<button id="mediaPickerClose" type="button" aria-label="Close picker">×</button>
	</div>
	<input id="mediaSearchInput" type="search" placeholder="Search" aria-label="Search stickers or GIFs">
	<div id="mediaResults" class="mediaResults" role="listbox" aria-label="Media results"></div>
	<p id="mediaPickerStatus" class="mediaPickerStatus" aria-live="polite"></p>
</div>

</div>

<button id="changeAccountButton" type="button" onclick="changeUser()">
🔄 change account
</button>

<script
type="module"
src="access.js?v=1"
></script>

</body>

</html>
